<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meera Post Writer</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f7f5f1;
    --surface: #ffffff;
    --text: #1f1d1a;
    --muted: #6b665e;
    --border: #e2ddd4;
    --accent: #2f5d50;
    --accent-text: #ffffff;
    --accent-soft: #e6efeb;
    --error: #a33a2c;
    --error-soft: #f8e7e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --surface: #201f1c;
      --text: #ece9e3;
      --muted: #a39e94;
      --border: #35332e;
      --accent: #7fb8a4;
      --accent-text: #10201b;
      --accent-soft: #23312c;
      --error: #f0a093;
      --error-soft: #3a2320;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font: 600 1.75rem/1.2 Georgia, "Times New Roman", serif; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  .hint { font-weight: 400; color: var(--muted); }
  input, textarea {
    width: 100%;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  textarea { resize: vertical; min-height: 88px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field { margin-bottom: 16px; }
  .ideas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .idea {
    font: inherit; font-size: .8rem;
    background: var(--accent-soft); color: var(--text);
    border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer;
  }
  .idea:hover { outline: 1px solid var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button.primary, button.secondary {
    font: inherit; font-weight: 600;
    border-radius: 8px; padding: 10px 18px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .55; cursor: wait; }
  .status { color: var(--muted); font-size: .9rem; }
  .error {
    background: var(--error-soft); color: var(--error);
    border-radius: 8px; padding: 10px 12px; margin-top: 14px;
  }
  .post { white-space: pre-wrap; margin: 0 0 16px; font-size: 1.02rem; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .meta h2 { font-size: 1rem; margin: 0; }
  details { border-top: 1px solid var(--border); padding-top: 12px; margin-bottom: 16px; }
  summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
  .sources { white-space: pre-wrap; color: var(--muted); font-size: .9rem; margin: 10px 0 0; }
  .revise { display: flex; gap: 10px; }
  .revise input { flex: 1; min-width: 0; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) {
    main { padding-top: 24px; }
    .revise { flex-direction: column; }
  }
</style>
</head>
<body>
<main>
  <h1>Meera Post Writer</h1>
  <p class="sub">Give it a post idea and, ideally, one fresh fact. It drafts a LinkedIn post in Meera's voice.</p>

  <form class="card" id="form">
    <div class="field">
      <label for="topic">Post idea</label>
      <input id="topic" required placeholder="e.g. Why we have no fragrance">
      <div class="ideas" id="ideas"></div>
    </div>
    <div class="field">
      <label for="fact">Fresh fact from Meera <span class="hint">(optional, but posts are better with one)</span></label>
      <textarea id="fact" placeholder="A customer question, a number or a story. e.g. A customer emailed last week asking if we forgot to add scent."></textarea>
    </div>
    <div class="row">
      <button class="primary" id="draftBtn" type="submit">Write post</button>
      <span class="status" id="status"></span>
    </div>
    <div class="error" id="error" hidden></div>
  </form>

  <section class="card" id="result" hidden>
    <div class="meta">
      <h2>Draft <span class="hint" id="words"></span></h2>
      <button class="secondary" id="copyBtn" type="button">Copy post</button>
    </div>
    <p class="post" id="post"></p>
    <details id="sourcesBox">
      <summary>Numbers used and where they came from</summary>
      <p class="sources" id="sources"></p>
    </details>
    <form class="revise" id="reviseForm">
      <input id="revision" placeholder='Ask for a change, e.g. "make it shorter"' required>
      <button class="primary" id="reviseBtn" type="submit">Revise</button>
    </form>
    <div class="row" style="margin-top:14px">
      <button class="secondary" id="newBtn" type="button">Start a new post</button>
    </div>
  </section>
</main>

<script>
  const IDEAS = [
    "Why we have no fragrance",
    "14 months without a Vitamin C launch",
    "Ask any brand for its pH",
    "Parabens aren't the villain",
    'Fake "cold-pressed"',
    '"7 peptides" is just a label',
    "You're using too little sunscreen",
    "0.1% can still be on the label",
    "Ceramides at the bottom of the list",
    "67% buy again, and what we got wrong",
    "Not a doctor, and that's fine",
  ];
  const MAX_MESSAGES = 21;
  const $ = (id) => document.getElementById(id);

  let history = [];
  let currentPost = "";

  for (const idea of IDEAS) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "idea";
    b.textContent = idea;
    b.onclick = () => { $("topic").value = idea; $("fact").focus(); };
    $("ideas").append(b);
  }

  function setBusy(busy, label) {
    $("draftBtn").disabled = busy;
    $("reviseBtn").disabled = busy;
    $("status").textContent = busy ? label : "";
  }

  function showError(msg) {
    $("error").textContent = msg;
    $("error").hidden = !msg;
    if (msg && !$("result").hidden) $("result").before($("error"));
  }

  async function ask(userText, label) {
    showError("");
    setBusy(true, label);
    const next = [...history, { role: "user", parts: [{ text: userText }] }].slice(-MAX_MESSAGES);
    try {
      const res = await fetch("/api/draft", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: next }),
      });
      const data = await res.json().catch(() => ({ error: "The server sent an unexpected reply." }));
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      history = [...next, { role: "model", parts: data.parts }];
      render(data.text);
      return true;
    } catch (err) {
      showError(err.message === "Failed to fetch" ? "Couldn't reach the server. Check your connection." : err.message);
      return false;
    } finally {
      setBusy(false);
    }
  }

  function render(text) {
    const cut = text.search(/^\s*---\s*$/m);
    currentPost = (cut === -1 ? text : text.slice(0, cut)).trim();
    const sources = cut === -1 ? "" : text.slice(cut).replace(/^\s*---\s*/, "").trim();
    $("post").textContent = currentPost;
    $("words").textContent = `· ${currentPost.split(/\s+/).filter(Boolean).length} words`;
    $("sources").textContent = sources;
    $("sourcesBox").hidden = !sources;
    $("result").hidden = false;
    $("form").after($("result"));
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  $("form").onsubmit = (e) => {
    e.preventDefault();
    history = [];
    const fact = $("fact").value.trim();
    const msg = `Topic: ${$("topic").value.trim()}` + (fact ? `\nFact: ${fact}` : "");
    ask(msg, "Writing, this can take up to a minute...");
  };

  $("reviseForm").onsubmit = async (e) => {
    e.preventDefault();
    if (await ask($("revision").value.trim(), "Revising, this can take up to a minute...")) $("revision").value = "";
  };

  $("copyBtn").onclick = async () => {
    try {
      await navigator.clipboard.writeText(currentPost);
      $("copyBtn").textContent = "Copied";
      setTimeout(() => ($("copyBtn").textContent = "Copy post"), 1500);
    } catch {
      showError("Couldn't copy automatically. Select the text and copy it instead.");
    }
  };

  $("newBtn").onclick = () => {
    history = [];
    currentPost = "";
    $("result").hidden = true;
    $("topic").value = "";
    $("fact").value = "";
    showError("");
    $("topic").focus();
  };
</script>
</body>
</html>
